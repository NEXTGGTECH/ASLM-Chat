name: Tests - Tools

on:
  push:
    branches-ignore:
      - 'jules-docs-dev-*'
      - 'jules-patchnotes-dev-*'
  pull_request:

concurrency:
  group: tests-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  context_compression:
    name: context_compression
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache server venv
        uses: actions/cache@v6
        with:
          path: Data/venvs/server
          key: aslm-chat-venv-server-${{ runner.os }}-${{ hashFiles('Settings/venv_requirements.json') }}
          restore-keys: |
            aslm-chat-venv-server-${{ runner.os }}-

      - name: Prepare venv
        run: |
          python -c "from Services import venv_manager; import sys; sys.exit(0 if venv_manager.ensure_venv('server', log=True) else 1)"
          VENV_PYTHON=$(python -c "from Services import venv_manager; print(venv_manager.get_venv_python('server'))")
          echo "VENV_PYTHON=${VENV_PYTHON}" >> "$GITHUB_ENV"
          test -x "$VENV_PYTHON"

      - name: Install pytest
        run: |
          "$VENV_PYTHON" -m pip install pytest

      - name: Run pytest
        working-directory: Tools/context_compression
        run: |
          "$VENV_PYTHON" -m pytest -q -m "not integration"

