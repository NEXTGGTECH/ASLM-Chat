name: Tests - Backend

on:
  push:
    branches-ignore:
      - 'jules-docs-dev-*'
      - 'jules-patchnotes-dev-*'
  pull_request:

concurrency:
  group: tests-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Apps.Tests (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache server venv
        uses: actions/cache@v6
        with:
          path: Data/venvs/server
          key: aslm-chat-venv-server-${{ runner.os }}-${{ hashFiles('Settings/venv_requirements.json') }}
          restore-keys: |
            aslm-chat-venv-server-${{ runner.os }}-

      - name: Prepare server venv
        run: |
          python -c "from Services import venv_manager; import sys; sys.exit(0 if venv_manager.ensure_venv('server', log=True) else 1)"
          VENV_PYTHON=$(python -c "from Services import venv_manager; print(venv_manager.get_venv_python('server'))")
          echo "VENV_PYTHON=${VENV_PYTHON}" >> "$GITHUB_ENV"
          test -x "$VENV_PYTHON"

      - name: Install pytest
        run: |
          "$VENV_PYTHON" -m pip install pytest pytest-django

      - name: Run unit tests
        run: |
          "$VENV_PYTHON" -m pytest Apps/Tests -q -m unit

  backend-component:
    name: Apps.Tests (component)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache server venv
        uses: actions/cache@v6
        with:
          path: Data/venvs/server
          key: aslm-chat-venv-server-${{ runner.os }}-${{ hashFiles('Settings/venv_requirements.json') }}
          restore-keys: |
            aslm-chat-venv-server-${{ runner.os }}-

      - name: Prepare server venv
        run: |
          python -c "from Services import venv_manager; import sys; sys.exit(0 if venv_manager.ensure_venv('server', log=True) else 1)"
          VENV_PYTHON=$(python -c "from Services import venv_manager; print(venv_manager.get_venv_python('server'))")
          echo "VENV_PYTHON=${VENV_PYTHON}" >> "$GITHUB_ENV"
          test -x "$VENV_PYTHON"

      - name: Install pytest
        run: |
          "$VENV_PYTHON" -m pip install pytest pytest-django

      - name: Run component tests
        run: |
          "$VENV_PYTHON" -m pytest Apps/Tests -q -m component

  backend-integration:
    name: Apps.Tests (integration + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache server venv
        uses: actions/cache@v6
        with:
          path: Data/venvs/server
          key: aslm-chat-venv-server-${{ runner.os }}-${{ hashFiles('Settings/venv_requirements.json') }}
          restore-keys: |
            aslm-chat-venv-server-${{ runner.os }}-

      - name: Prepare server venv
        run: |
          python -c "from Services import venv_manager; import sys; sys.exit(0 if venv_manager.ensure_venv('server', log=True) else 1)"
          VENV_PYTHON=$(python -c "from Services import venv_manager; print(venv_manager.get_venv_python('server'))")
          echo "VENV_PYTHON=${VENV_PYTHON}" >> "$GITHUB_ENV"
          test -x "$VENV_PYTHON"

      - name: Install pytest
        run: |
          "$VENV_PYTHON" -m pip install pytest pytest-django

      - name: Run integration and e2e tests
        run: |
          "$VENV_PYTHON" -m pytest Apps/Tests -q -m "integration or e2e"
