[pytest]
DJANGO_SETTINGS_MODULE = ASLM.settings
testpaths = .
pythonpath = ..
addopts = --strict-markers
markers =
    unit: fast pure-logic tests without database or network
    component: Django ORM and test-client tests against the sqlite test database
    integration: real adapters and subprocesses against in-process fake servers (offline)
    e2e: full scenario flows from HTTP request to persisted state
    live: requires external live services (never run in CI)
